<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- Where the files load from sees at most "blairsaid.github.io" - never the page path or
     the '#' that says which files. -->
<meta name="referrer" content="origin">
<meta name="theme-color" content="#0b0b0c">
<title>Photos</title>
<!--
  Gallery for HD shares from the Messages app.

  This page holds no photos. The link that opens it says which files after the '#', which a
  browser never sends to the server, and each photo and video loads straight from where the
  app uploaded it.

  Link format:  g.html#t=<title>&r=<public host>&m=<message folder>&i=P0.jpg,V1.mp4,...
  Each file is at https://<host>/hd/<folder>/<name> in the Cloudflare R2 bucket, with its grid
  picture at <n>_t.jpg beside it. Videos play in the phone's own player at full quality.

  The files were on Google Drive at first, and Google refuses to let another site's page play
  a Drive video - its download address answered 403, and its API streamed briefly then blocked
  it as "automated queries" (2026-09-26). That dead end is why storage moved to R2; Drive links
  were then dropped from this page altogether.
-->
<style>
  :root {
    --bg: #0b0b0c;
    --panel: #161618;
    --text: #f2f2f3;
    --muted: #9a9aa2;
    --accent: #7ab4ff;
    --gap: 3px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  header {
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px 14px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .grid {
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, 1fr); max-width: 1200px; margin: 0 auto; } }
  .tile {
    position: relative; aspect-ratio: 1; overflow: hidden; background: var(--panel);
    border: 0; padding: 0; cursor: pointer; display: block; width: 100%;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play {
    position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  }
  .play span {
    width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.45);
    border: 2px solid rgba(255,255,255,.9); display: grid; place-items: center;
  }
  .play span::after {
    content: ""; margin-left: 4px; border-style: solid; border-width: 10px 0 10px 17px;
    border-color: transparent transparent transparent #fff;
  }
  .gone {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: var(--muted); font-size: 13px; padding: 12px;
  }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .empty { padding: 30vh 24px 0; text-align: center; color: var(--muted); }

  /* ---- full-screen viewer: native swipe via scroll-snap, no gesture code ---- */
  .viewer { position: fixed; inset: 0; background: #000; z-index: 10; }
  .viewer[hidden] { display: none; }
  .track {
    position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain;
  }
  .track::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
    display: grid; place-items: center; position: relative;
  }
  .slide img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  /* Clear of the top bar, so the player's own buttons never sit under the count and the X. */
  .slide.video { padding: calc(env(safe-area-inset-top, 0px) + 64px) 0 calc(env(safe-area-inset-bottom, 0px) + 12px); }
  .slide video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .cant { text-align: center; padding: 24px; color: var(--muted); }
  .cant p { margin: 0 0 16px; color: var(--text); font-size: 17px; }
  .cant a { display: inline-block; margin: 6px; padding: 10px 16px; border-radius: 999px;
    border: 1px solid #2c2c31; color: var(--accent); text-decoration: none; font-weight: 550; }
  .cant small { display: block; margin-top: 14px; font-size: 12px; }
  .slide .gone { position: static; }
  .spinner {
    position: absolute; width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  .bar > * { pointer-events: auto; }
  .count { font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.6); padding-left: 6px; }
  .btn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.45); color: #fff; font-size: 20px; line-height: 40px;
    display: grid; place-items: center; text-decoration: none;
  }
  .actions { display: flex; gap: 8px; }
  .btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<main id="app"></main>

<div class="viewer" id="viewer" hidden>
  <div class="track" id="track"></div>
  <div class="bar">
    <div class="count" id="count"></div>
    <div class="actions">
      <a class="btn" id="full" target="_blank" rel="noopener" aria-label="Open full size">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-8 8M10 20H4v-6"/></svg>
      </a>
      <button class="btn" id="close" aria-label="Close">&#x2715;</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- the link --------------------------------------------------------------------------
  var params = {};
  location.hash.replace(/^#/, "").split("&").forEach(function (pair) {
    var i = pair.indexOf("=");
    if (i > 0) params[pair.slice(0, i)] = decodeURIComponent(pair.slice(i + 1));
  });
  var NAME = /^[0-9]+\.[A-Za-z0-9]{1,5}$/;
  var host = /^[a-z0-9.-]+\.[a-z]{2,}$/i.test(params.r || "") ? params.r : null;
  var folderR2 = /^[A-Za-z0-9]{10,}$/.test(params.m || "") ? params.m : null;
  var r2Base = host && folderR2 ? "https://" + host + "/hd/" + folderR2 + "/" : null;

  // P or V - photo or video - then its name in the message's folder.
  var items = (params.i || "").split(",").map(function (s) {
    var kind = s.charAt(0);
    if ((kind === "P" || kind === "V") && r2Base && NAME.test(s.slice(1))) {
      return { video: kind === "V", name: s.slice(1) };
    }
    return null;
  }).filter(Boolean);

  var app = document.getElementById("app");
  if (!items.length) {
    app.innerHTML = '<p class="empty">This link is incomplete - ask for it to be sent again.</p>';
    return;
  }

  /** The file itself, full size - what the viewer shows and the ↗ button opens. */
  function fullUrl(it) { return r2Base + it.name; }
  /** The small picture for the grid (and a video's poster). */
  function thumbUrl(it) { return r2Base + it.name.replace(/\.[^.]+$/, "") + "_t.jpg"; }

  var photos = items.filter(function (it) { return !it.video; }).length;
  var videos = items.length - photos;
  function n(count, word) { return count + " " + word + (count === 1 ? "" : "s"); }
  // Capitalised like the app's "3 Photos (HD)" line that links here.
  var heading = videos === 0 ? n(photos, "Photo")
    : photos === 0 ? n(videos, "Video")
    : n(photos, "Photo") + " and " + n(videos, "Video");
  document.title = heading;

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "text") e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { e.appendChild(c); });
    return e;
  }

  // A file cleared from the bucket (Settings > Clear old uploads) fails to load: say so.
  function onGone(image, box) {
    image.addEventListener("error", function () {
      image.remove();
      box.appendChild(el("div", { class: "gone", text: "No longer available" }));
    });
  }

  // ---- the grid --------------------------------------------------------------------------
  var head = el("header", {}, [
    el("div", {}, [
      el("h1", { text: heading }),
      params.t ? el("div", { class: "sub", text: params.t }) : el("span")
    ])
  ]);
  app.appendChild(head);

  var grid = el("div", { class: "grid" });
  items.forEach(function (it, index) {
    var tile = el("button", { class: "tile", "aria-label": (it.video ? "Video " : "Photo ") + (index + 1) });
    var thumb = el("img", { src: thumbUrl(it), alt: "", loading: index < 8 ? "eager" : "lazy", decoding: "async" });
    tile.appendChild(thumb);
    if (it.video) {
      // No still (the app couldn't make one): a dark tile with its play mark, not "No longer
      // available" - the video itself may be fine.
      thumb.addEventListener("error", function () { thumb.remove(); });
    } else {
      // A photo without its grid picture falls back to the photo itself, once.
      thumb.addEventListener("error", function onError() {
        thumb.removeEventListener("error", onError);
        onGone(thumb, tile);
        thumb.src = fullUrl(it);
      });
    }
    if (it.video) tile.appendChild(el("div", { class: "play" }, [el("span")]));
    tile.addEventListener("click", function () { open(index); });
    grid.appendChild(tile);
  });
  app.appendChild(grid);
  app.appendChild(el("footer", {
    text: photos ? "Tap a photo to see it full size. Press and hold one to save it." : "Tap a video to play it."
  }));

  // ---- the viewer ------------------------------------------------------------------------
  var viewer = document.getElementById("viewer");
  var track = document.getElementById("track");
  var count = document.getElementById("count");
  var full = document.getElementById("full");
  var slides = items.map(function (it) {
    var s = el("div", { class: "slide" });
    track.appendChild(s);
    return s;
  });
  var current = -1;

  // Originals are 3-5 MB, so only the one on screen and its neighbours load. A video is
  // made when it's first reached - its still as the poster, only its header fetched until
  // Play - and paused whenever it's swiped away.
  function fill(index) {
    slides.forEach(function (s, i) {
      var it = items[i];
      var near = Math.abs(i - index) <= 1;
      if (it.video) {
        var video = s.querySelector("video");
        if (i === index && !s.firstChild) {
          s.classList.add("video");
          // The phone's own player, on the original file - one set of controls, full quality.
          // If it can't, the slide says so and offers the file; it never swaps in another
          // player on its own.
          video = el("video", {
            src: fullUrl(it), poster: thumbUrl(it),
            controls: "", playsinline: "", preload: "metadata", "aria-label": "Video " + (i + 1)
          });
          video.addEventListener("error", function () { cantPlay(s, it, video.error && video.error.code); });
          s.appendChild(video);
        } else if (i !== index && video) {
          video.pause();
        }
      } else if (near && !s.firstChild) {
        var spin = el("div", { class: "spinner" });
        var image = el("img", { src: fullUrl(it), alt: "Photo " + (i + 1), decoding: "async" });
        image.addEventListener("load", function () { spin.remove(); });
        image.addEventListener("error", function () { spin.remove(); });
        onGone(image, s);
        s.appendChild(spin);
        s.appendChild(image);
      }
    });
  }

  /** A video the phone couldn't play here, with the player's error code for diagnosis. */
  function cantPlay(slide, it, why) {
    slide.innerHTML = "";
    var parts = [
      el("p", { text: "This video can't play here." }),
      el("a", { href: fullUrl(it), target: "_blank", rel: "noopener", text: "Download" })
    ];
    if (why) parts.push(el("small", { text: "(" + why + ")" }));
    slide.appendChild(el("div", { class: "cant" }, parts));
  }

  function show(index) {
    if (index === current) return;
    current = index;
    count.textContent = items.length > 1 ? (index + 1) + " / " + items.length : "";
    // Photos: the original, where press-and-hold saves it. Videos: the file itself, which
    // the phone offers to download.
    full.href = fullUrl(items[index]);
    fill(index);
  }

  function open(index) {
    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    track.scrollLeft = index * track.clientWidth;
    current = -1;
    show(index);
    // Back (or the iPhone's edge swipe) closes the viewer rather than leaving the page.
    history.pushState({ viewer: true }, "");
  }

  function close() {
    viewer.hidden = true;
    document.body.style.overflow = "";
    slides.forEach(function (s) { var v = s.querySelector("video"); if (v) v.pause(); });
    current = -1;
  }

  var settle;
  track.addEventListener("scroll", function () {
    clearTimeout(settle);
    settle = setTimeout(function () {
      show(Math.round(track.scrollLeft / track.clientWidth));
    }, 80);
  }, { passive: true });

  window.addEventListener("resize", function () {
    if (!viewer.hidden && current >= 0) track.scrollLeft = current * track.clientWidth;
  });

  document.getElementById("close").addEventListener("click", function () { history.back(); });
  window.addEventListener("popstate", function () { if (!viewer.hidden) close(); });
  document.addEventListener("keydown", function (e) {
    if (viewer.hidden) return;
    if (e.key === "Escape") history.back();
    if (e.key === "ArrowRight" && current < items.length - 1) track.scrollTo({ left: (current + 1) * track.clientWidth, behavior: "smooth" });
    if (e.key === "ArrowLeft" && current > 0) track.scrollTo({ left: (current - 1) * track.clientWidth, behavior: "smooth" });
  });
})();
</script>
</body>
</html>
